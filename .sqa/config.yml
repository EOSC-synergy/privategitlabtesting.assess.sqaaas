config:
  credentials:
  - id: https://gitlab.com/PalomoIFCA/privategitlabtesting
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.com/PalomoIFCA/privategitlabtesting:
      branch: main
      credential_tmp: true
      credentials_id: https://gitlab.com/PalomoIFCA/privategitlabtesting
      repo: https://gitlab.com/PalomoIFCA/privategitlabtesting
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting git:
        commands:
        - /usr/bin/env sh .sqa/script.rose_outgoing_octopus.sh
        container: qc.acc_claret_rustic_kingfisher
  QC.Doc:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.violet_cranky_emu.sh
        container: qc.doc_pineapple_peppy_raven
      gitlab.com/PalomoIFCA/privategitlabtesting git:
        commands:
        - /usr/bin/env sh .sqa/script.smoke_artistic_cougar.sh
        container: qc.doc_lavender_pensive_cobra
      gitlab.com/PalomoIFCA/privategitlabtesting markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.linen_serene_cassowary.sh
        container: qc.doc_flint_stoic_fox
  QC.Lic:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting licensee:
        commands:
        - /usr/bin/env sh .sqa/script.wave_friendly_falcon.sh
        container: qc.lic_polar_smart_crow
  QC.Sec:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting bandit:
        commands:
        - /usr/bin/env sh .sqa/script.clove_gentle_lynx.sh
        container: qc.sec_watermelon_responsible_kangaroo
  QC.Sty:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting flake8:
        commands:
        - /usr/bin/env sh .sqa/script.slate_inspired_puffin.sh
        container: qc.sty_rose_silly_quoll
      gitlab.com/PalomoIFCA/privategitlabtesting jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.navy_apprehensive_elephant.sh
        container: qc.sty_cream_confused_capybara
  QC.Uni:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting pytest:
        commands:
        - /usr/bin/env sh .sqa/script.reef_content_hare.sh
        container: qc.uni_turmeric_stoic_fox
  QC.Ver:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.azure_eager_emu.sh
        container: qc.ver_crimson_shrewd_tortoise
timeout: 5400
