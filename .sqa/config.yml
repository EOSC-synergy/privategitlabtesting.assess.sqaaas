      gitlab.com/PalomoIFCA/privategitlabtesting get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.ash_decisive_clownfish.sh
        container: qc.ver_byzantium_positive_termite
timeout: 5400
