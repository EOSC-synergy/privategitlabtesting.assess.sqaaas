      gitlab.com/PalomoIFCA/privategitlabtesting get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.fern_exuberant_kingfisher.sh
        container: qc.ver_ash_tranquil_cheetah
timeout: 5400
