config:
  credentials:
  - id: https://gitlab.com/PalomoIFCA/privategitlabtesting
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.com/PalomoIFCA/privategitlabtesting:
      branch: main
      credential_tmp: true
      credentials_id: https://gitlab.com/PalomoIFCA/privategitlabtesting
      repo: https://gitlab.com/PalomoIFCA/privategitlabtesting
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting git:
        commands:
        - /usr/bin/env sh .sqa/script.thunder_joyful_coyote.sh
        container: qc.acc_celadon_brave_albatross
  QC.Doc:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.isabelline_cautious_orca.sh
        container: qc.doc_vermilion_optimistic_dhole
      gitlab.com/PalomoIFCA/privategitlabtesting git:
        commands:
        - /usr/bin/env sh .sqa/script.chocolate_patient_nighthawk.sh
        container: qc.doc_blush_resourceful_hornbill
      gitlab.com/PalomoIFCA/privategitlabtesting markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_energetic_cormorant.sh
        container: qc.doc_peach_wise_impala
  QC.Lic:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting licensee:
        commands:
        - /usr/bin/env sh .sqa/script.arctic_quirky_grasshopper.sh
        container: qc.lic_glacier_daring_marmoset
  QC.Sec:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cobalt_inventive_seahorse.sh
        container: qc.sec_mahogany_sociable_bison
  QC.Sty:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cadet_reliable_salamander.sh
        container: qc.sty_wine_balanced_cobra
      gitlab.com/PalomoIFCA/privategitlabtesting jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.peony_productive_pangolin.sh
        container: qc.sty_ceru_devoted_hyena
  QC.Uni:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting pytest:
        commands:
        - /usr/bin/env sh .sqa/script.yellow_courageous_osprey.sh
        container: qc.uni_grege_anxious_moth
  QC.Ver:
    repos:
      gitlab.com/PalomoIFCA/privategitlabtesting get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.coffee_fierce_chameleon.sh
        container: qc.ver_periwinkle_cautious_barracuda
timeout: 5400
